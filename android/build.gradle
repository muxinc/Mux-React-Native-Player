apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.mux.reactnativeplayer'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'com.mux.reactnativeplayer'
  compileSdkVersion safeExtGet('compileSdkVersion', 37)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 23)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  google()
  mavenCentral()
  maven { url = uri("https://muxinc.jfrog.io/artifactory/default-maven-release-local") }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  implementation project(':expo-modules-core')
  // LifecycleEventListener uses the host-selected React Native (mobile or TV) artifact.
  implementation 'com.facebook.react:react-android'
  implementation "com.mux.player:android:1.6.0"
  // Keep UI and Now Playing controls aligned with Mux Player 1.6.0's Media3 line.
  implementation "androidx.media3:media3-session:${safeExtGet('media3Version', '1.11.0')}"
  implementation "androidx.media3:media3-ui:${safeExtGet('media3Version', '1.11.0')}"
}
